services:
  api:
    build:
      # Repo root, not ./services -- the API needs scripts/ and
      # packages/shared/ as build-context siblings (see
      # services/Dockerfile's comments).
      context: .
      dockerfile: services/Dockerfile
    container_name: brasaland-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/workspace/services/api
      # Anonymous volume: keeps the image's own .venv instead of it
      # being shadowed by the bind mount above (or by nothing, if no
      # local .venv exists on the host).
      - api-venv:/workspace/services/api/.venv
      - ./scripts:/workspace/scripts
      - ./packages/shared:/workspace/packages/shared
      - ./data/pipelines:/workspace/data/pipelines
      - ./data/process:/workspace/data/process
      - ./docs:/workspace/docs
    depends_on:
      - redis
      - qdrant
    networks:
      - brasaland-network

  # DEV-55: broker + result backend for the Celery task queue. The API
  # (producer) and worker (consumer) both connect here over REDIS_URL --
  # never to each other directly.
  redis:
    image: redis:7-alpine
    container_name: brasaland-redis
    # noeviction: if the queue ever filled memory, Redis's default
    # behavior is to silently drop keys to make room -- for a task
    # queue that means silently losing queued/result data. Refusing new
    # writes with an OOM error instead is the safer failure mode here.
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    networks:
      - brasaland-network

  # Milestone 7 (RAG & Knowledge Base): vector store for the
  # brasaland_knowledge collection.
  qdrant:
    image: qdrant/qdrant:latest
    container_name: brasaland-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - brasaland-network

  # DEV-55: the Celery worker. Same image as the API (it needs the same
  # code -- tasks.py, celery_app.py, plus data/pipelines for the task
  # that calls into pipeline.py) but a different command, and its own
  # container -- this is the "separate process, not inside the FastAPI
  # process" requirement. Stopping the api/ui containers never touches
  # this one.
  worker:
    build:
      context: .
      dockerfile: services/Dockerfile
    container_name: brasaland-worker
    command: ["uv", "run", "celery", "-A", "celery_app", "worker", "--loglevel=info"]
    env_file:
      - .env
    volumes:
      - ./services/api:/workspace/services/api
      - api-venv:/workspace/services/api/.venv
      - ./scripts:/workspace/scripts
      - ./packages/shared:/workspace/packages/shared
      - ./data/pipelines:/workspace/data/pipelines
    depends_on:
      - redis
    networks:
      - brasaland-network

  # DEV-55: Flower, for watching the queue during development --
  # queued/in-progress/completed/failed tasks, per task_id.
  flower:
    build:
      context: .
      dockerfile: services/Dockerfile
    container_name: brasaland-flower
    command: ["uv", "run", "celery", "-A", "celery_app", "flower", "--port=5555"]
    env_file:
      - .env
    ports:
      - "5555:5555"
    depends_on:
      - redis
    networks:
      - brasaland-network

  ui:
    build:
      # Repo root, not ./uis -- backoffice's dashboard page imports
      # directly from the monorepo's root-level src/ (see
      # uis/Dockerfile's comments).
      context: .
      dockerfile: uis/Dockerfile
    container_name: brasaland-ui
    env_file:
      - .env
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./uis/website:/workspace/uis/website
      - /workspace/uis/website/node_modules
      - /workspace/uis/website/.next
      - ./uis/backoffice:/workspace/uis/backoffice
      - /workspace/uis/backoffice/node_modules
      - /workspace/uis/backoffice/.next
      - ./src:/workspace/src
    depends_on:
      - api
    networks:
      - brasaland-network

volumes:
  qdrant-storage:
  api-venv:

networks:
  brasaland-network:
    name: brasaland-network
    driver: bridge