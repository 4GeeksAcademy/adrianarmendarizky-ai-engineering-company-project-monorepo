[project]
name = "brasaland-supplier-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "tinydb",
    "pydantic",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.2.2",
    "bcrypt==4.0.1",
    "python-multipart>=0.0.32",
    "resend>=2.36.0",
    "sqlmodel>=0.0.39",
    "psycopg[binary]>=3.3.4",
]

[project.scripts]
seed = "seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py", "routes/*.py", "routers/*.py"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*", "seed.py"]
